name: Build Macos Wheels

on:
  # Callable by release.yml and still dispatchable by hand. The dispatch inputs
  # are unchanged -- there are none -- so the manual experience is the same.
  workflow_call:
    inputs:
      os:
        description: 'Operating System'
        required: false
        default: 'macos-14'
        type: string
      ci_pipeline_iid:
        description: 'Patch component of the package version'
        required: false
        default: '0'
        type: string
      artifact_name:
        description: 'Name of the uploaded wheel artifact'
        required: false
        default: 'wheels-macos-arm64'
        type: string
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating System'
        required: true
        default: 'macos-14'
        type: choice
        options:
          - macos-14
          - macos-15-intel

permissions:
  contents: read

jobs:
  build-mac-wheels:
    runs-on: ${{ inputs.os }}

    env:
      # An input rather than an inherited variable: workflow-level env in the
      # caller does not cross into a called workflow. setup.py:38-41 turns this
      # into the wheel's patch component.
      CI_PIPELINE_IID: ${{ inputs.ci_pipeline_iid || '0' }}

    steps:
    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.31.9'

    - name: display cmake version
      run: cmake --version

    - name: checkout the repository
      uses: actions/checkout@v4
      with:
        # recursive, not true: the C++ library is the extern/slideio submodule
        # and carries four submodules of its own.
        submodules: 'recursive'
        path: slideio

    - name: resolve the slideio submodule commit
      id: slideio
      shell: bash
      working-directory: slideio
      # `git rev-parse HEAD:<path>` reads the gitlink out of the tree, so this
      # works whether or not the submodule is initialised. It replaces
      # hashFiles() on .git/modules/..., which returns an empty string when the
      # glob matches nothing and leaves restore-keys hiding the degraded key.
      run: |
        set -euo pipefail
        echo "sha=$(git rev-parse HEAD:extern/slideio)" >> "$GITHUB_OUTPUT"

    - uses: conda-incubator/setup-miniconda@v3
      with:
        auto-activate-base: true
        activate-environment: ""

    - name: Create conan2 conda environment
      shell: bash -el {0}
      run: |
        conda create -n conan2 python=3.12 -y
        conda activate conan2
        python -m pip install conan distro
        conan --version
        conda deactivate

    - name: cache conan packages
      uses: actions/cache@v4
      with:
        path: ~/.conan2
        key: conan-${{ runner.os }}-${{ runner.arch }}-${{ steps.slideio.outputs.sha }}
        restore-keys: |
          conan-${{ runner.os }}-${{ runner.arch }}-

    - name: build the slideio C++ library
      shell: bash -el {0}
      working-directory: slideio
      run: |
        conda activate conan2
        python build-slideio.py -c release
        conda deactivate

    - name: Build wheels
      working-directory: slideio
      shell: bash -el {0}
      run: |
        ./build-wheels-macos.sh
        ./rename-macos-wheels.sh ./dist

    - name: test the built wheel
      # tests/ covers the parts that exist only on the Python side of the
      # binding -- everything else is tested in the C++ repository -- and it
      # needs the shared image corpus. Set the SLIDEIO_IMAGES_PATH repository
      # variable to enable the step; with nothing to read there is nothing to
      # test, so it is skipped. SLIDEIO_SKIP_MISSING_IMAGES stays unset on
      # purpose: in CI a missing image must fail the run, not quietly skip the
      # test that needed it.
      if: vars.SLIDEIO_IMAGES_PATH != ''
      shell: bash -el {0}
      env:
        SLIDEIO_IMAGES_PATH: ${{ vars.SLIDEIO_IMAGES_PATH }}
      run: |
        conda create -n wheeltest python=3.12 -y
        conda activate wheeltest
        # pyyaml for tests/test_workflows.py, which reads the workflow YAML and
        # needs no wheel of its own.
        python -m pip install pytest pillow numpy pyyaml
        # The renamed wheel, not the work tree: this tests what ships.
        python -m pip install --no-index \
          --find-links "$GITHUB_WORKSPACE/slideio/dist" slideio
        # Run from outside the checkout so `import slideio` resolves to the
        # installed wheel and not to the source directory beside it.
        cd "$RUNNER_TEMP"
        python -m pytest "$GITHUB_WORKSPACE/slideio/tests"
        conda deactivate

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name || 'wheels-macos-arm64' }}
        path: ./slideio/dist/*.whl
        if-no-files-found: error
        retention-days: 30
