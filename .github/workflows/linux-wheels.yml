name: Linux Wheels

on:
  workflow_dispatch:

env:
  CONAN_REVISIONS_ENABLED: 1
  CONAN_DISABLE_CHECK_COMPILER: 1
  SLIDEIO_HOME: ${{ github.workspace }}/slideio

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container:
      # 2.10.0 ships a prebuilt conan cache for slideio's dependencies, which is
      # what makes building the C++ library from source in CI affordable.
      image: booritas/slideio-manylinux_2_28_x86_64:2.10.0

    steps:
    - name: checkout the repository
      uses: actions/checkout@v4
      with:
        # recursive, not true: the C++ library is the extern/slideio submodule
        # and carries four submodules of its own.
        submodules: 'recursive'
        path: slideio

    - name: cache conan packages
      uses: actions/cache@v4
      with:
        path: ~/.conan2
        key: conan-manylinux-${{ hashFiles('slideio/.git/modules/extern/slideio/HEAD') }}
        restore-keys: |
          conan-manylinux-

    - name: build the slideio C++ library
      shell: bash -el {0}
      working-directory: slideio
      run: |
        python3 build-slideio.py -c release

    - name: build wheels
      shell: bash -el {0}
      working-directory: slideio
      run: |
        ./build-wheels-manylinux.sh

    - uses: actions/upload-artifact@v4
      with:
          name: wheels
          path: ./slideio/wheelhouse
