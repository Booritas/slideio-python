name: Linux Wheels

on:
  workflow_dispatch:

env:
  CONAN_REVISIONS_ENABLED: 1
  CONAN_DISABLE_CHECK_COMPILER: 1
  SLIDEIO_HOME: ${{ github.workspace }}/slideio

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container:
      # 2.10.0 ships a prebuilt conan cache for slideio's dependencies, which is
      # what makes building the C++ library from source in CI affordable.
      image: booritas/slideio-manylinux_2_28_x86_64:2.10.0

    steps:
    - name: checkout the repository
      uses: actions/checkout@v4
      with:
        # recursive, not true: the C++ library is the extern/slideio submodule
        # and carries four submodules of its own.
        submodules: 'recursive'
        path: slideio

    - name: cache conan packages
      uses: actions/cache@v4
      with:
        path: ~/.conan2
        key: conan-manylinux-${{ hashFiles('slideio/.git/modules/extern/slideio/HEAD') }}
        restore-keys: |
          conan-manylinux-

    - name: build the slideio C++ library
      shell: bash -el {0}
      working-directory: slideio
      run: |
        python3 build-slideio.py -c release

    - name: build wheels
      shell: bash -el {0}
      working-directory: slideio
      run: |
        ./build-wheels-manylinux.sh

    - name: test the built wheel
      # tests/ covers the parts that exist only on the Python side of the
      # binding -- everything else is tested in the C++ repository -- and it
      # needs the shared image corpus. Set the SLIDEIO_IMAGES_PATH repository
      # variable to a path visible inside this container to enable the step;
      # with nothing to read there is nothing to test, so it is skipped.
      # SLIDEIO_SKIP_MISSING_IMAGES stays unset on purpose: in CI a missing
      # image must fail the run, not quietly skip the test that needed it.
      if: vars.SLIDEIO_IMAGES_PATH != ''
      shell: bash -el {0}
      env:
        SLIDEIO_IMAGES_PATH: ${{ vars.SLIDEIO_IMAGES_PATH }}
      run: |
        py=/opt/python/cp312-cp312/bin/python
        $py -m pip install pytest pillow numpy
        # The repaired wheel, not the work tree: this tests what ships.
        $py -m pip install --no-index \
          --find-links "$GITHUB_WORKSPACE/slideio/wheelhouse" slideio
        # Run from outside the checkout so `import slideio` resolves to the
        # installed wheel and not to the source directory beside it.
        cd "$RUNNER_TEMP"
        $py -m pytest "$GITHUB_WORKSPACE/slideio/tests"

    - uses: actions/upload-artifact@v4
      with:
          name: wheels
          path: ./slideio/wheelhouse
