name: Build Validation

# The per-commit gate. One wheel per platform, for one Python version, and the
# tests/ suite against it -- not the 3.9-3.14 loop the wheel workflows run,
# which is roughly six times the work and belongs to a release.
#
# release.yml is the other half and is untouched by anything here.

# Documentation changes skip the gate. Nothing under docs/ and no Markdown file
# reaches a wheel -- CLAUDE.md included, which is why the pattern is `**/*.md`
# rather than a path -- and a prose-only commit otherwise costs a full C++ build
# on three platforms, about 45 minutes of runner time. The `tooling` job is
# skipped along with the rest, which is the one real cost: a commit that touched
# only a Markdown file could in principle break tests/test_workflows.py through
# nothing but its own text, and would not be caught until the next code change.
# No workflow or test file matches either pattern, so that stays hypothetical.
#
# Note for anyone adding branch protection later: a run skipped by paths-ignore
# reports no status at all, so naming these jobs as required checks would leave a
# docs-only pull request waiting forever.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ungated, unlike the three platform jobs below: tests/test_ci_version.py and
  # tests/test_workflows.py need neither a built wheel nor the image corpus
  # (CLAUDE.md), and they are the only tests that check the CI configuration
  # itself -- the structural pins on this very file. Cheap enough to run on
  # every push and pull request without waiting on vars.SLIDEIO_IMAGES_PATH.
  tooling:
    name: CI tooling tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      # No submodules: neither test file touches extern/slideio.

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: install test dependencies
      run: python -m pip install pytest pyyaml

    - name: run the CI tooling tests
      run: pytest tests/test_ci_version.py tests/test_wheel_scripts.py tests/test_workflows.py

  # No `needs` anywhere in this file, deliberately: one platform failing should
  # not hide whether the other two build.
  manylinux:
    name: manylinux_2_28 (x86_64)
    runs-on: ubuntu-latest
    container:
      # Pinned, and the same image the wheels ship from. 2.10.0 carries a
      # prebuilt conan cache for slideio's dependencies, which is what makes
      # building the C++ library from source per commit affordable.
      image: booritas/slideio-manylinux_2_28_x86_64:2.10.0

    steps:
    - uses: actions/checkout@v4
      with:
        # recursive, not true: the C++ library is the extern/slideio submodule
        # and carries four submodules of its own.
        submodules: 'recursive'

    - name: resolve the slideio submodule commit
      id: slideio
      shell: bash
      run: |
        set -euo pipefail
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        echo "sha=$(git rev-parse HEAD:extern/slideio)" >> "$GITHUB_OUTPUT"

    - name: cache conan packages
      uses: actions/cache@v4
      with:
        path: ~/.conan2
        key: conan-manylinux-${{ steps.slideio.outputs.sha }}
        restore-keys: |
          conan-manylinux-

    - name: build the slideio C++ library
      shell: bash -el {0}
      run: python3 build-slideio.py -c release

    - name: build one wheel
      shell: bash -el {0}
      run: |
        set -euo pipefail
        py=/opt/python/cp312-cp312/bin/python
        $py -m pip install -U pip setuptools wheel build
        # --wheel: a bare `build` builds from an unpacked sdist in a temp
        # directory, and the sdist ships no extern/, so CMake finds no install
        # prefix there and fails.
        $py -m build --wheel
        # Seconds of work, and auditwheel rejecting the wheel is a real failure
        # mode worth catching on a pull request rather than at release. Output
        # lands in wheelhouse/.
        auditwheel repair -L "/core/libs" dist/*.whl

    - name: test the built wheel
      # Most of tests/ needs the shared image corpus; set the
      # SLIDEIO_IMAGES_PATH repository variable to a path visible inside this
      # container to enable the step. SLIDEIO_SKIP_MISSING_IMAGES stays unset on
      # purpose: in CI a missing image must fail the run, not quietly skip the
      # test that needed it.
      if: vars.SLIDEIO_IMAGES_PATH != ''
      shell: bash -el {0}
      env:
        SLIDEIO_IMAGES_PATH: ${{ vars.SLIDEIO_IMAGES_PATH }}
      run: |
        set -euo pipefail
        /opt/python/cp312-cp312/bin/python -m venv "$RUNNER_TEMP/venv"
        venv="$RUNNER_TEMP/venv/bin/python"
        $venv -m pip install pytest pillow numpy pyyaml
        # The repaired wheel, not the work tree: this tests what ships.
        $venv -m pip install --no-index \
          --find-links "$GITHUB_WORKSPACE/wheelhouse" slideio
        # Run from outside the checkout so `import slideio` resolves to the
        # installed wheel and not to the source directory beside it.
        cd "$RUNNER_TEMP"
        $venv -m pytest "$GITHUB_WORKSPACE/tests"

  macos:
    name: macOS arm64
    runs-on: macos-14

    steps:
    - name: setup cmake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        # The version macos-wheels.yml pins; newer CMake is not what the wheel
        # builds are known good against.
        cmake-version: '3.31.9'

    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: install python dependencies
      # No conda here: build-wheels-macos.sh needs it to make one environment
      # per Python version, and this job builds exactly one wheel.
      run: python -m pip install -U pip conan distro build

    - name: resolve the slideio submodule commit
      id: slideio
      shell: bash
      run: |
        set -euo pipefail
        echo "sha=$(git rev-parse HEAD:extern/slideio)" >> "$GITHUB_OUTPUT"

    - name: cache conan packages
      uses: actions/cache@v4
      with:
        path: ~/.conan2
        key: conan-macos-arm64-${{ steps.slideio.outputs.sha }}
        restore-keys: |
          conan-macos-arm64-

    - name: build the slideio C++ library
      run: python build-slideio.py -c release

    - name: build one wheel
      run: python -m build --wheel

    - name: test the built wheel
      if: vars.SLIDEIO_IMAGES_PATH != ''
      shell: bash
      env:
        SLIDEIO_IMAGES_PATH: ${{ vars.SLIDEIO_IMAGES_PATH }}
      run: |
        set -euo pipefail
        python -m venv "$RUNNER_TEMP/venv"
        venv="$RUNNER_TEMP/venv/bin/python"
        $venv -m pip install pytest pillow numpy pyyaml
        $venv -m pip install --no-index \
          --find-links "$GITHUB_WORKSPACE/dist" slideio
        cd "$RUNNER_TEMP"
        $venv -m pytest "$GITHUB_WORKSPACE/tests"

  windows:
    name: Windows x86_64
    runs-on: windows-2022

    steps:
    - name: setup cmake
      uses: jwlawson/actions-setup-cmake@v2

    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: install python dependencies
      # No msvc-dev-cmd: the committed CMake generator is "Visual Studio 17
      # 2022", which finds the toolchain itself -- windows-wheels.yml builds
      # green without one.
      run: python -m pip install -U pip conan distro build

    - name: resolve the slideio submodule commit
      id: slideio
      shell: bash
      run: |
        set -euo pipefail
        echo "sha=$(git rev-parse HEAD:extern/slideio)" >> "$GITHUB_OUTPUT"

    - name: cache conan packages
      uses: actions/cache@v4
      with:
        path: ~/.conan2
        key: conan-windows-${{ steps.slideio.outputs.sha }}
        restore-keys: |
          conan-windows-

    - name: build the slideio C++ library
      run: python build-slideio.py -c release

    - name: build one wheel and fix the .pyd name inside it
      shell: pwsh
      # Repair-Naming is load-bearing, not tidiness: lib.ps1:47 renames
      # slideiopybind*.pyd to the name the package imports, and an unrepaired
      # Windows wheel does not import at all.
      run: |
        python -m build --wheel
        . .\lib.ps1
        Repair-Naming

    - name: test the built wheel
      if: vars.SLIDEIO_IMAGES_PATH != ''
      shell: pwsh
      env:
        SLIDEIO_IMAGES_PATH: ${{ vars.SLIDEIO_IMAGES_PATH }}
      run: |
        python -m venv "$env:RUNNER_TEMP/venv"
        $venv = "$env:RUNNER_TEMP/venv/Scripts/python.exe"
        & $venv -m pip install pytest pillow numpy pyyaml
        & $venv -m pip install --no-index --find-links "$env:GITHUB_WORKSPACE/dist" slideio
        Set-Location $env:RUNNER_TEMP
        & $venv -m pytest "$env:GITHUB_WORKSPACE/tests"
